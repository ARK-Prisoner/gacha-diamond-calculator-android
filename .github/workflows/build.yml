name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev libffi-dev libssl-dev cmake \
            python3-dev python3-pip libltdl-dev \
            libbz2-dev liblzma-dev libsqlite3-dev libreadline-dev \
            libgdbm-dev libgdbm-compat-dev libexpat1-dev
          sudo apt-get clean

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "cython<3.0"

      - name: Cache buildozer SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.cache/pip
          key: buildozer-${{ runner.os }}-sdk-v2
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Remove preinstalled Android SDK (free disk / avoid conflict)
        run: sudo rm -rf /usr/local/lib/android

      - name: Build APK
        run: |
          unset ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gacha-calc-apk
          path: bin/*.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
          name: ${{ github.ref_name }}
